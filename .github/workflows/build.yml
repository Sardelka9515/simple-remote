name: Native AOT Build

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Native AOT (win-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore SimpleRemote.slnx

      - name: Run unit tests
        run: dotnet test --no-restore -c Release

      - name: Publish Native AOT
        run: dotnet publish src/SimpleRemote.Host -c Release -r win-x64 -p:PublishAot=true -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleRemote-win-x64-nativeaot
          path: publish/SimpleRemote.exe
          if-no-files-found: error

      - name: Create Release and upload assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/SimpleRemote.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
